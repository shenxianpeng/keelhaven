name: Keelhaven
options:
  bundleIdPrefix: com.keelhaven
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  KeelhavenCore:
    path: KeelhavenCore
targets:
  Keelhaven:
    type: application
    platform: macOS
    sources:
      - Keelhaven
      # Code-signing checks shared with the privileged helper.
      - Shared
      # The privileged helper's launchd plist, where SMAppService.daemon
      # looks for it (docs/ARCHITECTURE.md § "Reading as administrator").
      - path: LaunchDaemons/com.keelhaven.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      # Universal restic binary produced by Scripts/fetch-restic.sh, copied
      # into Contents/MacOS/ next to the app executable.
      - path: Vendor/restic/restic
        buildPhase:
          copyFiles:
            destination: executables
      # We redistribute that binary, so BSD-2-Clause obliges us to ship its
      # copyright notice. Goes to Contents/Resources (never Contents/MacOS —
      # that directory is for executables and a stray file there upsets
      # signature validation). Surfaced by the About window.
      - path: Vendor/restic/restic-LICENSE.txt
        buildPhase:
          copyFiles:
            destination: resources
    dependencies:
      - package: KeelhavenCore
      # The privileged helper, next to restic in Contents/MacOS/ — the
      # launchd plist's BundleProgram points there.
      - target: KeelhavenHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Keelhaven/Info.plist
      properties:
        CFBundleDisplayName: Keelhaven
        # Menu-bar-only app: no Dock icon, no app switcher entry
        LSUIElement: true
        # Without these, xcodegen writes literal defaults (1.0 / 1) and the
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION build settings — incl.
        # CI's run-number override — never reach the built app's Info.plist.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        # Assets.xcassets is generated by design/build.mjs — never hand-edit it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Keep in step with the latest released tag: release builds override
        # this from the tag, but source builds report it as-is — a stale value
        # makes them nag themselves to "update" to the version they already
        # have (docs/RELEASING.md).
        MARKETING_VERSION: 0.9.2
        CURRENT_PROJECT_VERSION: 1
        SWIFT_EMIT_LOC_STRINGS: YES
    postBuildScripts:
      # Nested executables must carry their own signature before the outer
      # app bundle is signed (Xcode signs the app last, but does not sign
      # plain copied executables).
      - name: Sign bundled restic
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/restic
        script: |
          BINARY="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/restic"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ -z "$IDENTITY" ]; then IDENTITY="-"; fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BINARY"
      # Stamp the current git commit into Info.plist for the About window.
      # Runs before code signing, so the signature stays valid.
      - name: Embed git commit
        basedOnDependencyAnalysis: false
        # Declared input forces this to run after ProcessInfoPlistFile,
        # so the edit is never overwritten (and still precedes signing).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          INFO="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          COMMIT=$(cd "$SRCROOT" && git rev-parse --short HEAD 2>/dev/null || echo unknown)
          # Uncommitted changes make the bare commit hash a lie — mark them.
          if ! (cd "$SRCROOT" && git diff --quiet HEAD 2>/dev/null); then
            COMMIT="${COMMIT}-dirty"
          fi
          /usr/libexec/PlistBuddy -c "Delete :GitCommit" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $COMMIT" "$INFO"

  # Runs `restic backup` as root for plans set to read files as
  # administrator. A launchd daemon the app registers with SMAppService; it
  # only accepts connections from Keelhaven signed by the same team, so an
  # ad-hoc build ships it but can never use it.
  KeelhavenHelper:
    type: tool
    platform: macOS
    sources:
      - KeelhavenHelper
      - Shared
    dependencies:
      - package: KeelhavenCore
    settings:
      base:
        PRODUCT_NAME: KeelhavenHelper
        # Becomes the code-signing identifier through the embedded
        # Info.plist; the app checks the helper against it.
        PRODUCT_BUNDLE_IDENTIFIER: com.keelhaven.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
