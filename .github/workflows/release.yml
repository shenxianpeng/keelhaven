name: Release

# Builds a universal Keelhaven.dmg and attaches it to a GitHub Release.
# Separate from ci.yml's ad-hoc build-app jobs, which exist only for
# Scripts/install-latest.sh (personal installs, not public distribution).
#
# Signing is best-effort by design: with no Apple Developer secrets set up
# (the current state — no $99/year membership), the app is ad-hoc signed and
# not notarized, so first launch needs a one-time Gatekeeper allowance. The
# release body and the site FAQ walk users through it. If the secrets from
# docs/RELEASING.md are ever added, the same tag push produces a
# Developer-ID-signed, notarized, stapled DMG with zero workflow changes —
# the Apple-specific steps below just start running.
on:
  push:
    tags:
      - "v*.*.*"
  # A manual run is a dry run by default: it builds the same universal DMG
  # and uploads it as a workflow artifact, touching nothing public. Tick
  # `publish` for the one-button release: bump project.yml on main if
  # needed, create the v<version> tag, publish the GitHub Release (which
  # triggers website.yml's DMG + latest.json mirror), and bump the tap.
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.0.0) — a tag push derives it from the tag instead"
        required: true
      publish:
        description: "Publish for real: bump project.yml, tag v<version>, GitHub Release, Homebrew tap. Off = build-only dry run."
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package, publish
    runs-on: macos-15
    # `notarytool --wait` can sit for a long time, and this is a 10×-billed
    # runner, so the 6-hour default would be 3600 billed minutes if Apple's
    # service ever stalls. 90 minutes is generous for a run that normally
    # takes well under 30.
    timeout-minutes: 90
    permissions:
      contents: write
      # To dispatch website.yml after publishing — see that step's comment.
      actions: write
    # The secrets context is not available in step-level `if`s directly, so
    # surface "are the Apple credentials configured?" as job env instead.
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.AC_API_KEY_ID != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      # True on a tag push and on a manual run with `publish` ticked — every
      # step that touches the outside world keys off this one flag.
      PUBLISHING: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        # inputs.version is free text typed by whoever clicked Run, so it
        # arrives as an env value rather than inlined into the script — the
        # regex below is what makes it trustworthy for every later step.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.0.0, got \"$VERSION\"" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A manual publish must not be able to release a side branch or reuse
      # a tag — a tag push proves both by existing.
      - name: Guard the manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publish runs must start from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ steps.version.outputs.version }} already exists — pick the next version" >&2
            exit 1
          fi

      # Keep project.yml's MARKETING_VERSION in step with the release so
      # source builds report the right version (docs/RELEASING.md). The tag
      # is created later by the release itself, pointing at this commit.
      - name: Bump project.yml on main
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CURRENT=$(sed -n 's/^[[:space:]]*MARKETING_VERSION: //p' project.yml | tr -d '[:space:]')
          if [ "$CURRENT" != "$VERSION" ]; then
            sed -i '' "s/^\([[:space:]]*MARKETING_VERSION:\).*/\1 $VERSION/" project.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add project.yml
            git commit -m "release: bump MARKETING_VERSION to $VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      # Universal binary for public distribution — one DMG for both
      # architectures, unlike ci.yml's per-arch artifacts.
      - name: Vendor restic (checksum-verified, universal)
        run: ./Scripts/fetch-restic.sh universal

      - name: Generate Xcode project
        run: xcodegen generate

      # Standard GitHub Actions pattern: import the Developer ID cert into a
      # throwaway keychain scoped to this job, never the runner's default.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # Identity "-" is ad-hoc: runnable on both architectures (arm64 refuses
      # entirely unsigned binaries), rejected by Gatekeeper only until the
      # user allows it once. --timestamp is meaningless without a real
      # certificate, so it rides with the Developer ID branch.
      - name: Resolve signing identity
        id: signing
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "identity=Developer ID Application" >> "$GITHUB_OUTPUT"
            echo "flags=--timestamp" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      # The team ID is a secret, so it reaches xcodebuild through the
      # environment rather than being pasted into the command line — the same
      # rule the app itself follows for restic's credentials.
      - name: Build Release
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGN_FLAGS: ${{ steps.signing.outputs.flags }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Not plain VERSION: every name here lands in xcodebuild's whole
          # environment, where a build phase could pick it up as $(VERSION).
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: >
          xcodebuild
          -project Keelhaven.xcodeproj
          -scheme Keelhaven
          -configuration Release
          -derivedDataPath build
          build
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="$SIGN_IDENTITY"
          DEVELOPMENT_TEAM="$TEAM_ID"
          OTHER_CODE_SIGN_FLAGS="$SIGN_FLAGS"
          MARKETING_VERSION="$APP_VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO

      # Apple notarizes a zip/dmg, not a bare .app — the .app is what gets
      # stapled afterward so Gatekeeper can check it offline.
      - name: Notarize app
        if: env.HAS_NOTARY == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent \
            build/Build/Products/Release/Keelhaven.app \
            "$RUNNER_TEMP/Keelhaven-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Keelhaven-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple build/Build/Products/Release/Keelhaven.app
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Keelhaven-notarize.zip"

      - name: Create DMG
        run: ./Scripts/make-dmg.sh build/Build/Products/Release/Keelhaven.app "Keelhaven-${{ steps.version.outputs.version }}.dmg"

      # Notarize the DMG too — the .app inside is already stapled, but the
      # DMG itself gets Gatekeeper-checked on first mount as well.
      - name: Notarize and staple DMG
        if: env.HAS_NOTARY == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "Keelhaven-${{ steps.version.outputs.version }}.dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "Keelhaven-${{ steps.version.outputs.version }}.dmg"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Delete signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

      # Unnotarized builds trip Gatekeeper on first launch, and people who
      # download straight from the GitHub Release never see the site FAQ — so
      # the walkthrough goes right in the release body. Notarized builds
      # don't need it and get a clean body. The text is shared with
      # Scripts/release-local.sh, the manual twin of this workflow.
      - name: Compose release-notes preamble
        run: |
          if [ "$HAS_NOTARY" = "true" ]; then
            : > release-note.md
          else
            cp Scripts/first-launch-note.md release-note.md
          fi

      # On a tag push the tag exists and target_commitish is ignored; on a
      # manual publish the release creates the tag, pointed at the commit
      # the bump step left main on.
      - name: Publish GitHub Release
        if: env.PUBLISHING == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.sha || github.sha }}
          files: Keelhaven-${{ steps.version.outputs.version }}.dmg
          body_path: release-note.md
          generate_release_notes: true

      # The release above is created with GITHUB_TOKEN, and GitHub
      # suppresses events made with a workflow's own token (anti-recursion),
      # so website.yml's `release: published` trigger never fires from here
      # — v0.3.0 shipped with a stale latest.json exactly this way. Dispatch
      # the deploy explicitly instead: workflow_dispatch is exempt from the
      # suppression, and the DMG is uploaded by now, so the mirror finds it
      # on the first look.
      - name: Deploy the website mirror
        if: env.PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main

      # Point the Homebrew tap (shenxianpeng/homebrew-tap) at the DMG that was
      # just published, so `brew install --cask shenxianpeng/tap/keelhaven`
      # serves it. Needs HOMEBREW_TAP_TOKEN (fine-grained PAT, contents:
      # write on the tap repo — docs/RELEASING.md); without the secret the
      # step is skipped and the next release-local.sh run — or a manual
      # Scripts/update-homebrew-tap.sh — catches the tap up.
      - name: Bump Homebrew tap
        if: env.PUBLISHING == 'true' && env.HAS_TAP_TOKEN == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./Scripts/update-homebrew-tap.sh "${{ steps.version.outputs.version }}" "Keelhaven-${{ steps.version.outputs.version }}.dmg"

      - name: Upload DMG artifact
        if: env.PUBLISHING != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Keelhaven-${{ steps.version.outputs.version }}
          path: Keelhaven-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error
