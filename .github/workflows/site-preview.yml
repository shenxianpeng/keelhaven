name: Site preview

# Builds site/ on every PR that touches it, and — once the two Cloudflare
# secrets exist — uploads that build as a preview version of the keelhaven-site
# Worker and comments the URL on the PR.
#
# This replaces Cloudflare's own Git integration, which failed every build
# because the root directory it recorded stayed `/` no matter what the
# dashboard was set to, and `npm ci` has nothing to install at the repo root.
# Doing it here means the log is in Actions, where it can be read and fixed.
# If the dashboard integration is still connected, disconnect it (Workers &
# Pages › keelhaven-site › Settings › Builds › Disconnect) so its red check
# stops shadowing this one.
#
# Production is untouched: keelhaven.app is GitHub Pages, published by
# website.yml. The Worker is only ever reached on its *.workers.dev URLs.
#
# `versions upload` uploads a version of an existing Worker without taking
# traffic; it cannot create the Worker. The push-to-main run below does that
# with `wrangler deploy`, so the first main run after this merges is what
# brings the Worker into being — before that, PR previews have nothing to
# attach a version to.

on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/site-preview.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Secrets are absent on forked PRs and before they are configured. The
      # build still runs in that case — a site that no longer builds is worth
      # catching either way — and only the deploy is skipped.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset — building only, no preview deploy"
          fi

      - name: Build site
        run: |
          npm ci --prefix site
          npm run build --prefix site

      # PR title reaches the shell through the environment, never through
      # ${{ }} interpolation: it is attacker-controlled text on a fork PR.
      - name: Upload a preview version
        id: preview
        if: github.event_name == 'pull_request' && steps.creds.outputs.configured == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          npx wrangler versions upload --message "PR #${PR_NUMBER}: ${PR_TITLE}" | tee /tmp/upload.log
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' /tmp/upload.log | tail -n1)
          if [ -z "$URL" ]; then
            echo "::warning::Version uploaded, but no preview URL appeared in the output"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # One comment per PR, rewritten in place on each push, so the thread
      # carries the current preview rather than a pile of stale ones.
      - name: Comment the preview link
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER='<!-- site-preview -->'
          BODY=$(printf '%s\n**Site preview:** %s\n\nBuilt from `%s`. English at the root, Chinese under `/zh/`. `/latest.json` and `/downloads/` 404 here by design — they are mirrored in only for the real deploy.\n' \
            "$MARKER" "$URL" "${SHA:0:7}")
          ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi

      # main (and a manual run) deploys the Worker itself. This is what creates
      # keelhaven-site the first time; afterwards it keeps the version previews
      # attach to current. Its production URL stays unused — do not point the
      # custom domain at it.
      - name: Deploy the worker
        if: github.event_name != 'pull_request' && steps.creds.outputs.configured == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
