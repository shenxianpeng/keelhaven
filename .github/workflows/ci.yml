name: CI

# macOS runners bill at 10× against the private-repo minutes quota, so this
# workflow is deliberately stingy (the quota ran dry once — 2026-08-15):
#   - docs/site/design-script changes skip CI entirely (the generated assets
#     under Keelhaven/ still trigger it, so app-affecting changes are covered)
#   - the app build lives in build-app.yml now and runs only when asked for;
#     it used to run twice on every main push at ~20 billed minutes a time
#   - a main push that is a squash-merge of an already-green PR skips the
#     tests it just ran (see the `if` on core-tests)
#   - a newer push to the same branch cancels the run it supersedes
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - design/**
      - .gitignore
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - design/**
      - .gitignore
  # Escape hatch for the squash-merge skip below, and for re-running after a
  # paths-ignore'd change that turned out to matter after all.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: KeelhavenCore tests
    runs-on: macos-15
    # A hung `swift test` would otherwise burn to the 6-hour default, which on
    # a 10× runner is 3600 billed minutes.
    timeout-minutes: 20
    # Skip main pushes that are squash-merges of a PR — GitHub writes the PR
    # number into the subject as "(#123)", and those exact tests went green on
    # the PR minutes earlier. Direct pushes to main (the common workflow here)
    # still run in full.
    #
    # The heuristic is deliberately blunt: a hand-written commit message that
    # happens to contain "(#" also skips. If that happens, re-run via
    # workflow_dispatch above.
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '(#')
    steps:
      - uses: actions/checkout@v7
      # The integration test suites exercise the real restic binary end-to-end
      # against all four backends: local disk, S3 (MinIO below), SFTP (sshd
      # below), and a REST server (rest-server below). They self-skip when
      # their backend is missing, but we want all of them running in CI —
      # hence the hard failure gates in the setup steps: a broken server here
      # must fail the job loudly, because a silent XCTSkip would look green
      # while testing nothing.
      - name: Install restic
        # untap: the runner image ships an untrusted aws/tap that makes every
        # brew command print tap-trust warnings; we don't use it.
        run: |
          brew untap aws/tap || true
          brew install restic
      # MinIO is a single static binary; fetching it directly is faster than
      # adding a brew tap. Credentials match the test defaults in
      # ResticS3IntegrationTests.swift.
      - name: Start MinIO (S3 integration tests)
        run: |
          curl --proto "=https" -fsSL -o "$RUNNER_TEMP/minio" \
            "https://dl.min.io/server/minio/release/darwin-$(uname -m | sed 's/x86_64/amd64/')/minio"
          chmod +x "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=keelhaven-test MINIO_ROOT_PASSWORD=keelhaven-test-secret \
            "$RUNNER_TEMP/minio" server --address 127.0.0.1:9000 "$RUNNER_TEMP/minio-data" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "::error::MinIO did not become healthy"
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      # rest-server ships only as source + a per-release tarball, no brew
      # formula (verified: `brew search rest-server` is empty). --no-auth
      # matches the common self-hosted default this backend targets in v1
      # (no --private-repos, no --append-only, no TLS); the authenticated
      # RESTIC_REST_USERNAME/PASSWORD path is covered by unit tests instead
      # (ResticCommandTests), the same way the S3 suite skips exercising a
      # wrong secret key live.
      - name: Start rest-server (REST integration tests)
        run: |
          REST_SERVER_VERSION=0.14.0
          ARCH=$(uname -m | sed 's/x86_64/amd64/')
          curl --proto "=https" -fsSL -o "$RUNNER_TEMP/rest-server.tar.gz" \
            "https://github.com/restic/rest-server/releases/download/v${REST_SERVER_VERSION}/rest-server_${REST_SERVER_VERSION}_darwin_${ARCH}.tar.gz"
          tar -xzf "$RUNNER_TEMP/rest-server.tar.gz" -C "$RUNNER_TEMP"
          REST_SERVER_BIN="$RUNNER_TEMP/rest-server_${REST_SERVER_VERSION}_darwin_${ARCH}/rest-server"
          chmod +x "$REST_SERVER_BIN"
          "$REST_SERVER_BIN" \
            --listen 127.0.0.1:8000 --path "$RUNNER_TEMP/rest-server-data" --no-auth \
            > "$RUNNER_TEMP/rest-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          echo "::error::rest-server did not become healthy"
          cat "$RUNNER_TEMP/rest-server.log"
          exit 1
      # Loopback sshd with key auth — the same setup restic's sftp backend
      # needs from a real user (non-interactive ssh, host key already known).
      - name: Enable sshd (SFTP integration tests)
        run: |
          sudo systemsetup -setremotelogin on || true
          nc -z 127.0.0.1 22 || sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          for _ in $(seq 1 30); do
            nc -z 127.0.0.1 22 && break
            sleep 1
          done
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=5 127.0.0.1 true
      - name: Run tests
        run: swift test --package-path KeelhavenCore --enable-code-coverage
      # KeelhavenCore is fully unit-tested and stays that way: any core code
      # added without tests turns this red.
      - name: Enforce 100% line coverage
        run: |
          BIN=$(swift build --package-path KeelhavenCore --show-bin-path)
          XCTEST="$BIN/KeelhavenCorePackageTests.xctest/Contents/MacOS/KeelhavenCorePackageTests"
          COVERAGE=$(xcrun llvm-cov export "$XCTEST" \
            -instr-profile="$BIN/codecov/default.profdata" \
            -ignore-filename-regex="Tests|\.build" \
            -summary-only \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'])")
          echo "KeelhavenCore line coverage: ${COVERAGE}%"
          python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= 100.0 else 1)" \
            || { echo "::error::KeelhavenCore line coverage is ${COVERAGE}%, below 100%"; exit 1; }
