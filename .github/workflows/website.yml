name: Website

# Builds the public website (site/, VitePress) and force-pushes the static
# output to this repo's gh-pages branch, which GitHub Pages serves at
# https://keelhaven.app/. One repo, no deploy keys — the separate site repo
# retired when this repo went public. See docs/WEBSITE.md for how the domain
# is wired up.
#
# Runs on ubuntu (bills at 1×, unlike the 10× macOS jobs in ci.yml) and only
# when site content actually changes.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/website.yml
  # Fires when a human publishes a release (say, a draft from the UI).
  # A release published by release.yml does NOT land here — GitHub
  # suppresses events created with a workflow's own token — which is why
  # release.yml dispatches this workflow explicitly after publishing.
  release:
    types: [published]
  workflow_dispatch:

# The workflow's own GITHUB_TOKEN pushes gh-pages — no cross-repo deploy key.
permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Runs on every deploy, not just the release trigger above — force_orphan
      # below replaces gh-pages wholesale each time, so a docs-only push would
      # otherwise wipe out whatever DMG a prior release run had mirrored here.
      #
      # On release-triggered runs the DMG may still be uploading: the
      # `published` webhook fires when the release is created, before
      # action-gh-release finishes attaching assets — v0.2.0 raced exactly
      # this way and the mirror silently skipped, killing latest.json (and
      # with it the in-app update prompt). So on the release trigger, poll
      # until the asset appears and fail loudly if it never does; on other
      # triggers a missing release/asset stays a normal skip.
      - name: Mirror latest release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/public/downloads
          TRIES=1
          [ "${{ github.event_name }}" = "release" ] && TRIES=30
          TAG="" ASSET=""
          for i in $(seq 1 "$TRIES"); do
            if gh release view --repo shenxianpeng/keelhaven --json tagName,assets > /tmp/release.json 2>/tmp/release.err; then
              TAG=$(jq -r .tagName /tmp/release.json)
              ASSET=$(jq -r '.assets[] | select(.name | endswith(".dmg")) | .name' /tmp/release.json | head -n1)
              [ -n "$ASSET" ] && break
              echo "Release $TAG has no .dmg asset yet (check $i/$TRIES)"
            else
              echo "No published release yet (check $i/$TRIES): $(cat /tmp/release.err)"
            fi
            [ "$i" -lt "$TRIES" ] && sleep 10
          done
          if [ -z "$ASSET" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "::error::Release published but its .dmg never appeared — refusing to deploy without a mirror; re-run this workflow once the asset exists"
              exit 1
            fi
            echo "No published release with a .dmg — skipping DMG mirror"
            exit 0
          fi
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo shenxianpeng/keelhaven --pattern '*.dmg' --dir site/public/downloads --clobber
          printf '{"version": "%s", "dmgURL": "https://keelhaven.app/downloads/%s"}\n' "$VERSION" "$ASSET" > site/public/latest.json
      - name: Build site
        run: |
          npm ci --ignore-scripts --prefix site
          npm run build --prefix site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/.vitepress/dist
          # force_orphan replaces gh-pages wholesale, so anything not in
          # `dist` is gone after every deploy — including the CNAME file that
          # keeps keelhaven.app attached. That file therefore lives in
          # site/public/CNAME and rides along in the build output; deleting it
          # takes the custom domain offline on the next push.
          force_orphan: true
